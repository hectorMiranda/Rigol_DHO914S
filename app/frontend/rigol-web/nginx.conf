server {
  listen 80;
  server_name _;

  # Proxy API + SSE to the Functions container. Buffering off and HTTP/1.1 are
  # required so Server-Sent Events flush to the browser immediately.
  location /api/ {
    proxy_pass http://api:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
